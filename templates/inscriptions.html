{% extends "base.html" %}

{% block title %}Gestion Inscriptions - PlatformScolaire{% endblock %}

{% block content %}
<div class="mb-8 flex justify-between items-center">
    <div>
        <h1 class="text-4xl font-bold text-gray-900">Gestion Inscriptions</h1>
        <p class="text-gray-600 mt-2">Gérer les inscriptions annuelles</p>
    </div>
    <button class="btn-primary">+ Nouvelle Inscription</button>
</div>

<div class="card-premium p-6">
    <div class="mb-4">
        <input type="text" placeholder="Chercher par élève..." class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
    </div>
    
    <table class="w-full">
        <thead>
            <tr class="border-b-2 border-gray-200">
                <th class="text-left py-3 font-semibold text-gray-900">Élève</th>
                <th class="text-left py-3 font-semibold text-gray-900">Année</th>
                <th class="text-left py-3 font-semibold text-gray-900">Frais Total</th>
                <th class="text-left py-3 font-semibold text-gray-900">Statut</th>
                <th class="text-left py-3 font-semibold text-gray-900">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr class="border-b hover:bg-gray-50">
                <td class="py-4">Ibrahim Mahamadou</td>
                <td class="py-4">2024-2025</td>
                <td class="py-4">150,000 FCFA</td>
                <td class="py-4"><span class="bg-green-100 text-green-700 px-3 py-1 rounded text-sm">Confirmée</span></td>
                <td class="py-4"><button class="text-blue-600 hover:underline text-sm">Voir</button></td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
