{% extends "base.html" %}

{% block title %}Connexion - PlatformScolaire{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-green-50 py-12 px-4">
    <div class="card-premium w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">PlatformScolaire</h2>
            <p class="text-gray-600">Gestion scolaire moderne</p>
        </div>
        
        <form method="POST" action="/api/auth/login" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                <input 
                    type="email" 
                    name="email" 
                    required
                    placeholder="directeur@ecole.com"
                    class="w-full px-4 py-3 border border-gray-300 rounded-8px focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Mot de passe</label>
                <input 
                    type="password" 
                    name="password" 
                    required
                    placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 rounded-8px focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
            </div>
            
            <button type="submit" class="btn-primary w-full py-3 font-semibold">
                Se connecter
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-gray-200 text-center text-sm text-gray-600">
            <p>Pour les démonstrations:</p>
            <p class="font-mono text-xs mt-2">Email: admin@ecole.local</p>
            <p class="font-mono text-xs">Mot de passe: password123</p>
        </div>
    </div>
</div>
{% endblock %}
